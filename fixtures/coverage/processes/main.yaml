# yaml-language-server: $schema=https://raw.githubusercontent.com/NikiforovAll/ai-sdlc/main/schemas/process.schema.json
# The loaded process: description, constraint, sub-activities two deep, all five
# rungs of the ladder, and every optional field on a fill and a recommendation.
name: Main
note: >-
  A process carrying every optional field a process has, so the empty ones in
  `minimal` are the contrast.
description: |-
  A process `description:` is markdown, rendered in the drawer that opens from the
  masthead. `minimal` has neither field, which is the branch this one contrasts.

  - a list, so the spacing inside a process panel is visible
  - a second item, for the same reason

  ```yaml
  note: the caption
  description: |-
    the long form
  ```
refs:
  - https://example.invalid/main-process

stages:
  - id: alpha
    name: Alpha
  - id: beta
    name: Beta

constraint:
  artifact: draft
  note: >-
    The draft is the fixture's declared bottleneck. It exists so the ① marker has
    an artifact to be found on.

activities:
  # A full fill at the bottom rung: manual, with usage, asset and refs.
  - id: start
    name: Start
    stage: alpha
    roles: [author]
    produces: [brief]
    why: The entry activity — no `consumes:`, so the graph has a root.
    tooling:
      tool: t-manual
      level: manual
      usage: >-
        The bottom rung: a person does this work, with the tool open beside them.
        Nothing is delegated, and the fill says so rather than staying silent.
      asset: fixtures/brief-outline.md
      refs:
        - https://example.invalid/fill-ref
    # The step's own reading list, drawn as "Read for this step" and distinct from
    # the fill's refs directly above it — both are present here so the drawer has
    # to keep them apart.
    refs:
      - https://example.invalid/step-reading
      - docs/naming-standard.md

  # Multi-role, a minimal fill, a minimal recommendation, and children.
  - id: shape
    name: Shape
    stage: alpha
    roles: [author, builder]
    consumes: [brief]
    produces: [draft]
    why: Two roles on one activity, so the figure has to place a shared box.
    tooling:
      tool: t-bare
      level: assisted
    recommends:
      # the smallest legal recommendation: a tool and nothing else
      - tool: t-rec
    activities:
      - id: shape-a
        name: Shape Detail
        roles: [builder]
        consumes: [brief]
        produces: [sketch]
        why: A sub-activity carrying a fill and a recommendation of its own.
        tooling:
          tool: t-full
          level: delegated-review
        recommends:
          - tool: t-rec
            level: assisted
            event: bare-event
            usage: A recommendation at depth 1, bound to a moment.
        # A sub-activity's own reading list — the same field the parent carries,
        # one level down, so the flattened panel has to draw it at depth too.
        refs:
          - https://example.invalid/sub-step-reading
        activities:
          - id: shape-a-1
            name: Shape Detail Inner
            roles: [builder]
            consumes: [sketch]
            produces: [trace]
            why: Depth 2, and an open slot this far down.
            open:
              need: >-
                A gap declared inside a sub-process, so the dashed treatment has
                to survive two levels of nesting.
      # A fill that names no tool: the level is claimed and nothing on the shelf
      # owns the step, so the drawer draws the ladder with no tool line above it.
      - id: shape-c
        name: Shape Untooled
        roles: [builder]
        consumes: [sketch]
        produces: [tally]
        why: A fill stating a level with no tool under it.
        tooling:
          level: assisted
          usage: >-
            The rung without a tool id. Three things are open and none of them
            is the one that does this, so naming one would be the worse claim.
      # unclaimed, and no `why:` either — the emptiest legal sub-activity. Its
      # second role is the only one an inset echoes rather than draws.
      - id: shape-b
        name: Shape Sibling
        roles: [builder, checker]
        consumes: [sketch]
        produces: [record]

  # An open slot with no `why:`.
  - id: check
    name: Check
    stage: beta
    roles: [checker]
    consumes: [draft]
    produces: [result]
    open:
      need: >-
        Something that reads a draft against the brief and says where they
        disagree. Today that comparison is done from memory.

  # The tool-less fill at the top level, where the playbook can see it: the
  # checker's shelf stays empty because a fill naming no tool has no harness to
  # stand under, which the sub-activity version of this state cannot exercise.
  - id: sign-off
    name: Sign Off
    stage: beta
    roles: [checker]
    consumes: [result]
    produces: [signoff]
    why: A top-level fill with a level and no tool.
    tooling:
      level: gated-autonomous
      usage: >-
        Stated at a rung nothing else in the fixture reaches from a tool-less
        fill, so the gauge is drawn from the level alone.

  # The top rung, plus recommendations carrying every optional field.
  - id: finish
    name: Finish
    stage: beta
    roles: [builder]
    consumes: [result]
    produces: [release-note]
    why: The exit activity, filled at the top of the ladder.
    tooling:
      tool: t-full
      level: autonomous
    recommends:
      - tool: t-rec
        level: manual
        event: full-event
        usage: Every optional field a recommendation has, all at once.
      - tool: t-bare
        level: gated-autonomous
        event: bare-event
      # The remaining rungs, so every level on the ladder is drawn on a
      # recommendation as well as on a fill.
      - tool: t-manual
        level: delegated-review
        usage: A recommendation with a level and no event — standing advice.
      - tool: t-auto
        level: autonomous
        usage: The top rung on a recommendation, where nothing holds a gate.
