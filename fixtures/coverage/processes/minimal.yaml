# The other half of the fixture: a process with every optional field left out.
# No note, no description, no constraint, one stage, and one activity carrying nothing
# beyond what the schema demands — the contrast that proves `main`'s optional
# fields are optional.
name: Minimal

stages:
  - id: only
    name: Only

activities:
  - id: do-the-thing
    name: Do The Thing
    stage: only
    roles: [checker]
    produces: [record]
