# A fixture, not a team. Its only job is to put every field the schema allows in
# front of the renderer at least once, and to leave every optional field absent
# at least once — the reference team fills nearly all of them, so the empty
# branches were going undrawn. Nothing here describes how anyone works; read
# `reference` for that.
#
# MARKDOWN: `description:` is markdown everywhere it appears — on the team, on a
# process, and on every catalog entry. Headings, lists, tables, blockquotes, code
# and links all work there, and the drawer is where they are read. `note:` is its
# short counterpart: one plain line, printed by a figure or an index, and the one
# the page hands to `<meta>`. The remaining prose fields (`why:`, `usage:`,
# `need:`, the constraint's `note:`) are folded into paragraphs as plain text, so
# markdown written there prints its own syntax. `events` are the exception to
# watch: their description doubles as a one-line caption in the overview, so keep
# it a single plain sentence.
#
# A markdown `description:` must use the literal block scalar `|-`. The folded
# `>-` joins consecutive lines, which silently collapses a table or a list into
# one paragraph.
name: Coverage Fixture
note: >-
  Every schema field, exercised once. Read it when a rendering branch needs a
  document that reaches it, not when you want to know how a team delivers.
description: |-
  The team's own `description:` is markdown, the same as a catalog entry's, and
  the drawer renders it under the `note` above.

  ### Why both fields exist

  | Field | Where it is printed |
  | --- | --- |
  | `note` | the process index, the page `<meta>`, one plain line |
  | `description` | the drawer, as markdown, at whatever length it needs |

  > A document that only had the caption had nowhere to say how it wants to be
  > read, which is the thing a reader most needs on arrival.
# A document-level `refs:`, drawn as "Read from" in the team drawer. One link, one
# bare string, so both branches of `isLinkableRef` render here. `processes/minimal.yaml`
# leaves the field absent.
refs:
  - https://example.invalid/coverage-fixture
  - a source with no URL, printed as plain text
version: "1.0"
status: draft

roles:
  # full: note + a description using most of the markdown the drawer supports
  - id: author
    name: Author
    note: Has both optional fields.
    description: |-
      Carries a `note` **and** a `description`, so the figure caption and the
      drawer body are drawn from *different* fields.

      ### What the drawer renders

      1. This heading, as a real `<h3>`.
      2. This ordered list.
      3. The table and the quote below.

      | Field | Where it is read | Markdown? |
      | --- | --- | --- |
      | `note` | beside the thing, in the figure | no |
      | `description` | the drawer, when a reader stops here | **yes** |

      > A note truncated to fit a lane and a paragraph nobody has room for are
      > two different jobs. That is why there are two fields.

      See [Layer 1 — the process spine](docs/ontology/01-process-spine.md).
  # bare: neither optional field
  - id: builder
    name: Builder
  # note only — no description, so the drawer falls back to whatever it shows
  # for a role that has none
  - id: checker
    name: Checker
    note: Has a note and no description.
    refs:
      - https://example.invalid/who-the-checker-is

# A catalog lives in a file of its own or inline here, never in both. Every
# other shelf in this fixture is a sibling file; events stay inline so the
# other half of the merge is drawn somewhere too.
#
# An event description is read twice — as markdown in the drawer, and as a plain
# caption in the overview row. One plain sentence is the only form that reads
# correctly in both.
events:
  - id: full-event
    name: Full Event
    description: An event carrying a description, kept to one plain sentence.
    refs:
      - https://example.invalid/where-the-event-is-seen
  # bare: no description
  - id: bare-event
    name: Bare Event
