# The team document: who the team is, and the roles every process is drawn along.
#
# This is the skeleton `ai-sdlc new` writes — the smallest team the schema
# accepts and the renderer draws. The one role below is here because the schema
# requires at least one, not because it is right.
#
# Each shared catalog is a file of its own beside this one, so a shelf can grow
# without pushing the document that introduces the team off the screen. Roles
# stay here: they are the axis the whole document is read along.
#
# The vocabulary is in docs/ontology/ — but you do not have to read it first.
# Run the `map-team` skill and it will teach you the words as it writes them.

name: New Team
version: "0.1"

# `draft` prints in the masthead. Change it to `living` when the document
# describes how the team actually works rather than how the session went.
status: draft

# A role is a hat someone wears — the vertical axis of every figure.
roles:
  - id: engineer
    name: Engineer
