name: Bugfix
note: >-
  The short path: a report becomes a reproduction, a cause, a guarded fix, and a
  release. No spec, no planning — the bug is the spec.
description: |-
  The bug is the spec, which is why this path has no Define stage and no
  acceptance criteria. Somebody has already told you what the software should
  have done; the whole question is whether you can make it do that without
  breaking something else.

  ### What it assumes

  - **Reproduce before diagnosing.** ① sits on `reproduction` because everything
    downstream is cheap once the bug reproduces on demand and guesswork until it
    does. A team that skips this ships fixes to hypotheses.
  - **The regression test is written from the reproduction, before the fix.**
    Written after, it only proves the fix compiles.
  - **Urgency is not an exemption.** `ship-fix` runs the same release gate as
    Feature does.

  ### Why the ends are thin

  `reproduce-bug` is open and `review-fix` carries nothing at all, and the
  difference between those two is the whole point of the notation. The first is
  work this team wants to hand over and has not found the tool for. The second is
  work they intend to keep doing themselves — one reviewer, one question, no
  tooling wanted.

stages:
  - id: triage
    name: Triage
  - id: diagnose
    name: Diagnose
  - id: fix
    name: Fix
  - id: verify
    name: Verify
  - id: ship
    name: Ship

constraint:
  artifact: reproduction
  note: >-
    Everything downstream is cheap once the bug reproduces on demand, and
    guesswork until it does. The reproduction is where this path is won or lost.

activities:
  - id: triage-bug
    name: Triage Report
    stage: triage
    roles: [lead]
    produces: [bug-report]
    why: An untriaged report is a rumour; triage decides whether it is work at all.
    tooling:
      tool: rovo-triage
      level: delegated-review
    recommends:
      - tool: claude-mention
        level: delegated-review
        usage: >-
          Standing advice. When the report arrived on a thread, answer it there
          rather than in a tool nobody reading the history will open. The answer
          then sits beside the question for whoever asks about this a year from
          now.

  - id: reproduce-bug
    name: Reproduce
    stage: diagnose
    roles: [engineer]
    consumes: [bug-report]
    produces: [reproduction]
    why: A bug you cannot reproduce on demand is a hypothesis, and fixes to hypotheses do not hold.
    open:
      need: >-
        Something that turns a report into a runnable case — the environment, the
        data and the steps, standing up on demand. Today every reproduction is
        rebuilt by hand from whatever the reporter remembered.
    recommends:
      - tool: bisect
        event: cannot-reproduce
        usage: >-
          Let history say when the behaviour changed — the first good build is a
          reproduction recipe when the report is not one.

  - id: locate-cause
    name: Locate Cause
    stage: diagnose
    roles: [engineer]
    consumes: [reproduction]
    produces: [root-cause]
    why: The first place the symptom appears is rarely the place the defect lives.
    tooling:
      tool: explore-subagent
      level: delegated-review

  - id: write-regression-test
    name: Write Regression Test
    stage: fix
    roles: [engineer]
    consumes: [reproduction]
    produces: [regression-test]
    why: The test is written from the reproduction, before the fix, or it only proves the fix compiles.
    tooling:
      tool: test-from-repro
      level: delegated-review

  - id: apply-fix
    name: Apply Fix
    stage: fix
    roles: [engineer]
    consumes: [root-cause, regression-test]
    produces: [change-set]
    why: The narrowest change that turns the regression test green.
    tooling:
      tool: agent-session
      level: delegated-review
    recommends:
      - tool: context-reset
        level: manual
        event: agent-loops
        usage: >-
          After the second failed correction, stop and start over with an
          opening that includes what the failures taught. A third correction is
          read against both earlier ones, which is why the third rarely works.
      - tool: plan-mode
        level: assisted
        event: agent-loops
        usage: >-
          Drop out of writing and re-read the ground. A loop is usually a wrong
          model of the code rather than a wrong edit, and no number of edits
          fixes that.

  - id: assemble-fix-evidence
    name: Assemble Evidence
    stage: verify
    roles: [engineer]
    consumes: [change-set, regression-test]
    produces: [evidence-pack]
    why: The proof a bugfix needs is narrow — the test failed before and passes after.
    tooling:
      tool: evidence-block
      level: delegated-review

  - id: review-fix
    name: Review Fix
    stage: verify
    roles: [reviewer]
    consumes: [evidence-pack, bug-report]
    produces: [review-verdict]
    why: The review asks one question — does this close the reported bug without widening the blast radius.

  - id: ship-fix
    name: Ship Fix
    stage: ship
    roles: [operator]
    consumes: [review-verdict, change-set]
    produces: [release]
    why: A bugfix ships on the same gate as anything else; urgency is not an exemption.
    tooling:
      tool: release-gate
      level: gated-autonomous
