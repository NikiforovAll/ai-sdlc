name: Feature
description: >-
  The long path: an intent becomes a spec, a plan, a change, proof, and a release.

stages:
  - id: define
    name: Define
  - id: plan
    name: Plan
  - id: build
    name: Build
  - id: verify
    name: Verify
  - id: ship
    name: Ship

constraint:
  artifact: evidence-pack
  note: >-
    The evidence handoff is the system's constraint: everything upstream of it
    moves faster than the reviewer can absorb proof. Improve here first.

activities:
  - id: write-spec
    name: Write Spec
    stage: define
    roles: [lead]
    produces: [spec]
    why: Work without a written intent gets re-litigated at review time.
    tooling:
      tool: spec-interview
      level: assisted
    recommends:
      - tool: grill-me
        usage: >-
          Pressure-test the intent before it is written down — a spec that
          survives interrogation gets re-litigated less at review time.
      - tool: rovo-triage
        usage: Pull what the backlog already knows, so the spec starts from it.

  - id: plan-work
    name: Plan Work
    stage: plan
    roles: [lead, engineer]
    consumes: [spec]
    produces: [work-plan]
    why: A shared plan is the cheapest place to catch a wrong decomposition.
    tooling:
      tool: plan-mode
      level: delegated-review
    recommends:
      - tool: grill-me
        event: spec-ambiguous
        usage: >-
          Two readings of the spec survived contact with the plan. Resolve them
          by interrogation before decomposing against the wrong one.
      - tool: effort-escalation
        level: assisted
        event: task-too-big
        usage: >-
          Spend the extra reasoning on the decomposition, not on the edits. A
          wrong cut is found days later; a wrong edit is found by the tests.

  - id: write-acceptance-criteria
    name: Write Acceptance Criteria
    stage: plan
    roles: [reviewer]
    consumes: [spec]
    produces: [acceptance-criteria]
    why: Review against criteria written before the change, not after it.
    open:
      need: >-
        A pass that reads the spec and proposes the criteria it implies, so the
        reviewer edits a list instead of transcribing one. The criteria have to
        stay the reviewer's — the ask is a draft, not a verdict.

  - id: implement
    name: Implement
    stage: build
    roles: [engineer]
    consumes: [work-plan, acceptance-criteria]
    produces: [change-set]
    why: The change itself — scoped by the plan, aimed at the criteria.
    tooling:
      tool: agent-session
      level: delegated-review
      usage: |
        Runs the whole inner loop under review: explore, edit, run the tests,
        repeat. The engineer reads every diff before it becomes a change set.
    recommends:
      - tool: wayfinder
        level: assisted
        event: task-too-big
        usage: >-
          Stop and re-decompose rather than pushing on. Solves the sunk-cost
          drift where a half-built oversized task gets finished anyway.
      - tool: plan-mode
        event: task-too-big
        usage: Drop out of writing and re-read the ground before re-cutting the work.
      - tool: rework-loop
        event: rework-requested
        usage: >-
          Work the verdict item by item. Rework is not a loop in the flow — it
          is a moment here, with a play attached.
      - tool: context-reset
        level: manual
        event: context-exhausted
        usage: >-
          Start again from what is now known, rather than compacting a session
          that is already mostly noise. Manual on purpose — deciding what
          mattered out of the last two hours is the entire job.
      - tool: session-rewind
        level: assisted
        event: context-exhausted
        usage: >-
          Return to the point the work turned, keeping the instructions that
          opened the session. Check the working tree afterwards: shell and
          subagent edits are not restored with the conversation.
      - tool: goal-condition
        level: delegated-review
        event: nothing-can-check-it
        usage: >-
          State the end condition and let a separate evaluator judge each turn
          against it. It reads the transcript rather than the repository, so the
          condition must be something the transcript can show.
      - tool: dynamic-workflow
        level: delegated-review
        event: work-is-parallel
        usage: >-
          Codify the fan-out as a script when the work needs more agents than one
          conversation can hold.
      - tool: fan-out-loop
        level: delegated-review
        event: work-is-parallel
        usage: >-
          One unattended run per unit, permissions scoped up front. Prove the
          prompt on two or three units first — a queue applies an ambiguous
          instruction consistently, which is what makes it hard to spot later.
      - tool: worktree-session
        level: assisted
        event: work-is-parallel
        usage: >-
          Separate checkouts so parallel edits cannot collide. Deciding which
          pieces are genuinely independent stays the engineer's call.
      - tool: agent-team
        level: assisted
        event: work-is-parallel
        usage: >-
          Experimental, off by default, and roughly seven times the token spend.
          Start with work that writes no code, where parallel exploration pays
          and coordination does not bite.
    activities:
      - id: break-down
        name: Break Down Task
        roles: [engineer]
        consumes: [work-plan]
        produces: [task-list]
        why: A task the agent can hold in one context is a task that ships.
        tooling:
          tool: plan-mode
          level: assisted
      - id: write-change
        name: Write Change
        roles: [engineer]
        consumes: [task-list]
        produces: [draft-change]
        why: The inner loop — explore, edit, test, repeat.
        recommends:
          - tool: explore-subagent
            level: delegated-review
            event: investigation-unbounded
            usage: >-
              Give the open-ended question to a separate context with a stated
              thoroughness, so reading the whole repository does not cost the
              session that has to act on the answer.
        activities:
          - id: explore
            name: Explore Codebase
            roles: [engineer]
            produces: [context-notes]
            tooling:
              tool: explore-subagent
              level: delegated-review
          - id: edit-test-loop
            name: Edit + Test Loop
            roles: [engineer]
            consumes: [context-notes]
            produces: [draft-change]
            tooling:
              tool: agent-session
              level: delegated-review
            recommends:
              - tool: permission-allowlist
                level: manual
                event: prompts-pile-up
                usage: >-
                  Pre-approve the commands already being approved without
                  reading, so the prompts that remain are the ones worth
                  stopping for.
              - tool: sandbox-mode
                level: assisted
                event: prompts-pile-up
                usage: >-
                  Bound the filesystem and network instead of approving one
                  command at a time — the same problem answered by limiting
                  consequences rather than enumerating permissions.
      - id: self-review
        name: Self-Review
        roles: [engineer]
        consumes: [draft-change]
        produces: [change-set]
        why: The author reads the diff as a reviewer before the reviewer must.
        tooling:
          tool: code-review-skill
          level: delegated-review
          usage: |
            A fresh context reads the diff and the criteria, without the
            reasoning that produced them. The author already knows what they
            meant and reads that intention into code that does not contain it;
            a reader that never heard the argument cannot.

            Ask it for findings that affect correctness. A reviewer prompted for
            gaps reports some regardless, and chasing all of them is how a small
            change becomes an over-engineered one.

  - id: write-tests
    name: Write Tests
    stage: build
    roles: [engineer]
    consumes: [acceptance-criteria]
    produces: [test-suite]
    why: Criteria that never became tests are opinions, not gates.
    tooling:
      tool: test-from-criteria
      level: delegated-review
      usage: |
        Generates the suite from the acceptance criteria, one test per criterion.

        Solves the drift where tests get written from the change instead of the
        criteria — the suite then proves conformance, not behaviour.

  - id: assemble-evidence
    name: Assemble Evidence
    stage: verify
    roles: [engineer]
    consumes: [change-set, test-suite]
    produces: [evidence-pack]
    why: Reviewers approve on vibes when the proof is scattered across tools.
    tooling:
      tool: evidence-block
      level: delegated-review
    recommends:
      - tool: structured-output
        level: delegated-review
        event: nothing-can-check-it
        usage: >-
          When the evidence is prose a reviewer has to read and believe, return
          it against a schema instead, so the pipeline can gate on it rather
          than a person re-running the check by hand.
      - tool: stop-hook
        level: gated-autonomous
        event: nothing-can-check-it
        usage: >-
          Make the check a script the session cannot finish without passing. It
          is the difference between an agent that believes it is done and one
          that has been shown to be. The runtime stops honouring a hook that
          blocks repeatedly, so it is a strong default rather than a guarantee.

  - id: review-conformance
    name: Review Conformance
    stage: verify
    roles: [reviewer]
    consumes: [evidence-pack, acceptance-criteria]
    produces: [review-verdict]
    why: The review judges evidence against criteria — not the diff against taste.
    open:
      need: >-
        Something that lines the evidence pack up against the acceptance criteria
        and says which ones are actually answered. This sits directly on the
        constraint, so it is the slot worth filling first.
    recommends:
      - tool: action-pr-review
        level: assisted
        usage: >-
          Standing advice, not a fill: an automated comment on every change is a
          second pair of eyes and never the verdict. It is good at what is
          mechanical and locally checkable, and silent on whether the change did
          what was asked — which is the whole question here.
      - tool: claude-md
        level: manual
        event: review-finds-a-pattern
        usage: >-
          When the finding would apply to the next change too, write the rule
          where every future session reads it. A correction made once is a
          correction you will make again.
      - tool: project-rules
        level: manual
        event: review-finds-a-pattern
        usage: >-
          When the rule holds for one part of the repository and not the rest,
          file it there rather than taxing every session with it.
      - tool: pretooluse-hook
        level: gated-autonomous
        event: review-finds-a-pattern
        usage: >-
          When the rule is mechanical, make it a hook rather than a sentence.
          Written instructions are advice a long session drifts from; a hook
          does not negotiate.

  - id: prepare-release
    name: Prepare Release
    stage: ship
    roles: [operator]
    consumes: [review-verdict, change-set]
    produces: [release-candidate]
    why: A verdict is not a deployable; someone assembles what actually ships.

  - id: ship
    name: Ship
    stage: ship
    roles: [operator]
    consumes: [release-candidate]
    produces: [release]
    why: The pipeline releases on green; a human can always hold the gate.
    tooling:
      tool: release-gate
      level: gated-autonomous
